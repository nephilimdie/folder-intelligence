[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-intelligence"
version = "1.6.0"
description = "Trova duplicati e organizza le tue cartelle chattando con un'AI locale (llama.cpp o Ollama)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9.0", "rich>=13.0.0", "prompt_toolkit>=3.0.40", "cryptography>=42", "keyring>=25"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
llama = ["llama-cpp-python>=0.3.37"]
dev = ["pytest>=8", "pyte>=0.8", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
folder-intelligence = "folder_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
